services:
  astro:
    image: node:22-alpine
    container_name: astro-app
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true # ファイル変更を定期チェック（ポーリング）させる設定
    volumes:
      - .:/app
    ports:
      - "4321:4321"
    tty: true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"